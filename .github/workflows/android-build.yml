name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/release.keystore
          key: android-release-keystore-v1
          restore-keys: |
            android-release-keystore-

      - name: Generate signing keystore if missing
        run: |
          mkdir -p ~/.android

          if [ ! -f ~/.android/release.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore ~/.android/release.keystore \
              -storepass test123 \
              -keypass test123 \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Test, OU=Development, O=Test, L=Test, ST=Test, C=US"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/app-release.apk"

          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner sign \
            --ks ~/.android/release.keystore \
            --ks-key-alias release \
            --ks-pass pass:test123 \
            --key-pass pass:test123 \
            --out "$SIGNED" \
            "$APK"

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
